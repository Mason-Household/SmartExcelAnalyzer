name: Smart Excel Analyzer

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    environment:
      - QDRANT_API_KEY=local-1234567890abcdef
    volumes:
      - qdrant_data:/qdrant/storage

  llm-service:
    image: fivemowner/smart-excel-analyzer-llm:latest
    container_name: llm-service
    volumes:
      - ./LLM:/app
      - model_cache:/app/model_cache
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - 'qdrant'

  backend:
    image: fivemowner/smart-excel-analyzer-backend:latest
    container_name: backend
    ports:
      - "5001:5001"  # Changed from 5000 to 5001
    volumes:
      - ./Backend:/src
    env_file:
      - .env
    environment:
      - ASPNETCORE_URLS=http://+:5001
      - ASPNETCORE_HTTP_PORTS=5001
      - ASPNETCORE_HTTPS_PORTS=
      - Kestrel__Endpoints__Http__Url=http://0.0.0.0:5001
    depends_on:
      - qdrant
      - llm-service

  frontend:
    image: fivemowner/smart-excel-analyzer-frontend:latest
    container_name: frontend
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Update environment variables to use port 5001
      - VITE_BASE_API_URL=/api
      - VITE_SIGNALR_HUB_URL=/progressHub
    depends_on:
      - backend

volumes:
  model_cache:
  qdrant_data: